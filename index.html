<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="MyDayClock — Cinematic exam countdown mission clock by Harsh Yadav. Track GTU, GATE, BARC, DRDO, ISRO exams with a SpaceX-inspired timeline.">
  <meta name="theme-color" content="#0a1a06">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Open Graph -->
  <meta property="og:title" content="MyDayClock — Harsh Yadav">
  <meta property="og:description" content="Cinematic exam countdown with SpaceX-inspired mission arc timeline.">
  <meta property="og:image" content="img/1.jpg">
  <meta property="og:type" content="website">

  <title>MYDAYS ARE COMING // HARSH YADAV</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/1.jpg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ═══════ LOADING SCREEN ═══════ -->
  <div class="loading-screen" id="loadingScreen" role="status" aria-label="Loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Initializing Mission Clock…</div>
  </div>

  <!-- ═══════ CINEMA FRAME ═══════ -->
  <div class="cinema-frame">

    <!-- Fullscreen Wallpapers -->
    <img class="bg-img active" id="bg0" src="img/1.jpg" alt="Background wallpaper 1">
    <img class="bg-img"        id="bg1" src="img/2.jpg" alt="Background wallpaper 2" loading="lazy">
    <img class="bg-img"        id="bg2" src="img/3.jpg" alt="Background wallpaper 3" loading="lazy">
    <img class="bg-img"        id="bg3" src="img/4.jpg" alt="Background wallpaper 4" loading="lazy">

    <!-- Particle Canvas -->
    <canvas id="ashCanvas" aria-hidden="true"></canvas>

    <!-- Gradient Overlay -->
    <div class="shadow-gradient" aria-hidden="true"></div>

    <!-- ═══════ SOUND UNLOCK BANNER ═══════ -->
    <button class="sound-unlock" id="soundUnlock"
            onclick="MDC.unlockAudio()"
            aria-label="Click to enable music and clock sounds">
      🔊 TAP TO LAUNCH AUDIO &amp; CLOCK
    </button>

    <!-- ═══════ TOP DOCK (Auto-hides) ═══════ -->
    <nav class="top-dock auto-hide" role="toolbar" aria-label="Mission controls">
      <span class="ist-badge" id="networkTime" aria-live="polite">🕒 IST SYNCING…</span>

      <button class="btn-ctrl" onclick="MDC.cycleTimeMode()" id="examModeBadge"
              aria-label="Toggle GTU exam start time">
        🕥 GTU: 10:30 AM
      </button>

      <button class="btn-ctrl" id="btnCycle" onclick="MDC.toggleAutoCycle()"
              aria-label="Toggle auto-cycle through milestones">
        🎥 Cycle: OFF
      </button>

      <button class="btn-ctrl active" id="btnW0" onclick="MDC.forceBg(0)" aria-label="Background 1">BG 1</button>
      <button class="btn-ctrl"        id="btnW1" onclick="MDC.forceBg(1)" aria-label="Background 2">BG 2</button>
      <button class="btn-ctrl"        id="btnW2" onclick="MDC.forceBg(2)" aria-label="Background 3">BG 3</button>
      <button class="btn-ctrl"        id="btnW3" onclick="MDC.forceBg(3)" aria-label="Background 4">BG 4</button>

      <!-- Music Mode Selector -->
      <select id="audioModeSelect" class="select-ctrl" onchange="MDC.onAudioModeChange()"
              aria-label="Select music mode">
        <option value="music_orig">🔊 Original (83 BPM + Tick)</option>
        <option value="music_slow">🌑 Slowed Dark (67 BPM)</option>
        <option value="music_fast">⚡ Boss Overdrive (101 BPM)</option>
        <option value="music_study">🧠 Soft Study (71 BPM)</option>
        <option value="tickonly">⏱️ Clock Tick Only</option>
        <option value="mute">🔇 Mute</option>
      </select>

      <button class="btn-ctrl" onclick="MDC.toggleTodayModal()" aria-label="Show today's study plan">📅 Today</button>
      <button class="btn-ctrl" onclick="MDC.toggleFullscreen()" aria-label="Toggle fullscreen">⛶</button>
    </nav>

    <!-- ═══════ TODAY'S PLAN MODAL ═══════ -->
    <div class="modal-overlay" id="modalOverlay" onclick="MDC.toggleTodayModal()"></div>
    <div class="modal" id="todayModal" role="dialog" aria-modal="true" aria-labelledby="todayTitle">
      <h3 id="todayTitle">📅 TODAY'S PLAN</h3>
      <p id="todayBody"></p>
      <button class="btn-ctrl" onclick="MDC.toggleTodayModal()">Close (Esc)</button>
    </div>

    <!-- ═══════ COUNTDOWN OVERLAY ═══════ -->
    <div class="countdown-overlay" role="timer" aria-label="Mission countdown">
      <div class="mission-kicker" id="pathKicker">GTU SEM 7 FINALE // 18 DEC 2026 • 01:00 PM IST</div>
      <div class="mission-heading" id="headingText">MYDAYS ARE COMING</div>
      <div class="t-minus" id="tMinus">T—</div>
      <div class="digits-row">
        <div class="unit-block">
          <div class="digit-pair" id="dMonth" aria-label="Months">01</div>
          <div class="sub-label">Months</div>
        </div>
        <div class="colon-sep" aria-hidden="true">:</div>
        <div class="unit-block">
          <div class="digit-pair" id="dDays" aria-label="Days">01</div>
          <div class="sub-label">Days</div>
        </div>
        <div class="colon-sep" aria-hidden="true">:</div>
        <div class="unit-block">
          <div class="digit-pair" id="dHours" aria-label="Hours">22</div>
          <div class="sub-label">Hours</div>
        </div>
        <div class="colon-sep" aria-hidden="true">:</div>
        <div class="unit-block">
          <div class="digit-pair" id="dMinutes" aria-label="Minutes">43</div>
          <div class="sub-label">Minutes</div>
        </div>
        <div class="colon-sep" aria-hidden="true">:</div>
        <div class="unit-block">
          <div class="digit-pair" id="dSeconds" aria-label="Seconds">00</div>
          <div class="sub-label">Seconds</div>
        </div>
      </div>
      <div class="quote-bar" id="quoteBar" aria-live="polite"></div>
    </div>

    <!-- ═══════ SPACEX MISSION ARC TIMELINE (Auto-hides) ═══════ -->
    <div class="mission-arc auto-hide" id="missionArc" role="navigation" aria-label="Mission timeline">
      <svg id="arcSvg" viewBox="0 0 1400 160" preserveAspectRatio="xMidYMid meet">
        <defs>
          <filter id="arcGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <!-- Background arc (dim track) -->
        <path id="arcBg"
              d="M 60,138 Q 700,12 1340,138"
              fill="none"
              stroke="rgba(165,255,100,0.12)"
              stroke-width="1.5"
              stroke-linecap="round"/>
        <!-- Progress arc (fills as milestones complete) -->
        <path id="arcFill"
              d="M 60,138 Q 700,12 1340,138"
              fill="none"
              stroke="rgba(184,255,107,0.55)"
              stroke-width="2.5"
              stroke-linecap="round"
              style="transition: stroke-dashoffset 1s ease;"/>
        <!-- Milestone nodes (populated by JS) -->
        <g id="arcNodes"></g>
      </svg>
    </div>

    <!-- Keyboard Hints -->
    <div class="kbd-hint auto-hide" aria-hidden="true">
      ← → NAVIGATE &nbsp;│&nbsp; SPACE MUTE &nbsp;│&nbsp; F FULLSCREEN &nbsp;│&nbsp; C CYCLE &nbsp;│&nbsp; T TODAY
    </div>

  </div>

  <!-- ═══════ AUDIO ═══════ -->
  <audio id="musicAudio" src="music/Music.mp3" loop preload="auto" style="display:none"></audio>

  <!-- ═══════ APPLICATION ═══════ -->
  <script src="js/app.js"></script>

</body>
</html>
