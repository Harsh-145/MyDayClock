<style>

  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #000000;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #ffffff;
  }

  /* 1. FULLSCREEN STAGE (ZERO BLACK BARS, ZERO CLUTTER) */
  .cinema-frame {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #020602;
  }

  /* 4 Overscaled Fullscreen Wallpapers Directly Linked to img/1.jpg .. img/4.jpg */

    position: fixed;
    top: -6vh; left: -6vw;
    width: 112vw; height: 112vh;
    object-fit: cover;
    object-position: center 18%;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
    z-index: 2;
    pointer-events: none;
    will-change: transform, opacity;
  }
  .bg-img.active {
    opacity: 1;
    animation: slowPan 18s infinite alternate ease-in-out;
  }
  @keyframes slowPan {
    0% { transform: scale(1.0); }
    100% { transform: scale(1.05); }
  }

  #ashCanvas {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    z-index: 3;
    pointer-events: none;
  }

  .shadow-gradient {
    position: fixed; inset: 0;
    background: linear-gradient(to bottom,

      transparent 52%,
      rgba(1, 6, 1, 0.72) 68%,
      rgba(0, 0, 0, 0.90) 86%,
      rgba(0, 0, 0, 0.96) 100%);
    z-index: 4;
    pointer-events: none;
  }

  /* 2. SOUND UNLOCK BANNER (Auto-hides immediately if browser allows autoplay or on first click) */
  #soundUnlockBanner {
    position: fixed;
    top: 12vh; left: 50%;

  .path-kicker {

  @media (max-width: 1100px) {

<script>
/* =========================================================================
   1. AUTOMATIC "music/Music.mp3" + "TIE-TIK" CLOCK ENGINE
   ========================================================================= */
let audioCtx = null;
let audioUnlocked = false;
let audioMode = 'bloodmoon_orig';
let tickToggle = false;
const bloodMoonEl = document.getElementById('bloodMoonAudioEl');

const JELLO_VARIANTS = {
  bloodmoon_orig:  { rate: 1.00, vol: 0.85, doubleTick: false }, // 83 BPM Original
  bloodmoon_slow:  { rate: 0.82, vol: 0.90, doubleTick: false }, // 67 BPM Slowed & Deepened
  bloodmoon_fast:  { rate: 1.18, vol: 0.92, doubleTick: true  }, // 101 BPM Boss Overdrive + 2x Tick
  bloodmoon_study: { rate: 0.74, vol: 0.32, doubleTick: false }, // 71 BPM Soft Study Mode
  tickonly:        { rate: 1.00, vol: 0.00, doubleTick: false },
  mute:            { rate: 1.00, vol: 0.00, doubleTick: false }
};

function unlockAndStartAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  audioUnlocked = true;
  document.getElementById('soundUnlockBanner').style.display = 'none';
  applyMusicVariant();
  playTieTikSound(true);
}

function applyMusicVariant() {
  const v = JELLO_VARIANTS[audioMode] || JELLO_VARIANTS.bloodmoon_orig;
  if (!audioUnlocked || audioMode === 'mute' || audioMode === 'tickonly') {
    bloodMoonEl.pause();
    return;
  }
  if ('preservesPitch' in bloodMoonEl) bloodMoonEl.preservesPitch = false;
  if ('webkitPreservesPitch' in bloodMoonEl) bloodMoonEl.webkitPreservesPitch = false;
  bloodMoonEl.playbackRate = v.rate;
  bloodMoonEl.volume = v.vol;
  bloodMoonEl.play().then(() => {
    document.getElementById('soundUnlockBanner').style.display = 'none';
  }).catch(() => {});
}

window.addEventListener('DOMContentLoaded', () => {
  bloodMoonEl.volume = 0.85;
  bloodMoonEl.play().then(() => {
    unlockAndStartAudio();
  }).catch(() => {});
});
['click', 'pointerdown', 'keydown'].forEach(ev => {
  window.addEventListener(ev, () => {
    if (!audioUnlocked) unlockAndStartAudio();
  }, { once: true });
});

/* Crisp Mechanical "Tie-Tik" Clock Escapement + Sub-Bass Thud */
function playTieTikSound(isMainSecond) {
  if (!audioUnlocked || !audioCtx || audioMode === 'mute') return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  tickToggle = !tickToggle;

  const clickOsc = audioCtx.createOscillator();
  const clickGain = audioCtx.createGain();
  const clickFilter = audioCtx.createBiquadFilter();

  clickFilter.type = 'bandpass';
  clickFilter.frequency.value = tickToggle ? 2450 : 1780;
  clickFilter.Q.value = 5.5;

  clickOsc.type = 'triangle';
  clickOsc.frequency.setValueAtTime(tickToggle ? 1200 : 860, now);
  clickOsc.frequency.exponentialRampToValueAtTime(160, now + 0.05);

  const vol = audioMode === 'bloodmoon_study' ? 0.12 : 0.42;
  clickGain.gain.setValueAtTime(vol, now);
  clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

  clickOsc.connect(clickFilter);
  clickFilter.connect(clickGain);
  clickGain.connect(audioCtx.destination);
  clickOsc.start(now);
  clickOsc.stop(now + 0.065);

  if (isMainSecond && audioMode !== 'bloodmoon_study') {
    const thudOsc = audioCtx.createOscillator();
    const thudGain = audioCtx.createGain();
    thudOsc.type = 'sine';
    thudOsc.frequency.setValueAtTime(tickToggle ? 86 : 68, now);
    thudOsc.frequency.exponentialRampToValueAtTime(24, now + 0.24);

    thudGain.gain.setValueAtTime(0.32, now);
    thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);

    thudOsc.connect(thudGain);
    thudGain.connect(audioCtx.destination);
    thudOsc.start(now);
    thudOsc.stop(now + 0.28);
  }
}

function updateAudioMode() {
  audioMode = document.getElementById('audioModeSelect').value;
  if (!audioUnlocked && audioMode !== 'mute') unlockAndStartAudio();
  applyMusicVariant();
}

/* =========================================================================
   2. COMPLETE EXAM TIMELINE (NOV 2026 - NOV 2027) + AUTO VARIANT MATCHING
   ========================================================================= */
let serverTimeOffsetMs = 0;
let timeModeIdx = 1; // 10:30 AM GTU Start (click to toggle 10:00 AM reporting)
let activeIdx = 1;   // Starts on 18 Dec MYDAYS ARE COMING
let autoCycle = false;
let cycleTimer = null;
let lastSec = -1;

const TIME_MODES = [
  { hm: '10:00', short: '🕙 GTU: 10:00 AM' },
  { hm: '10:30', short: '🕥 GTU: 10:30 AM' }
];

function getNextGtuExam(now, hm) {
  const gtuPapers = [
    { name: 'EXAM 1: MACHINE LEARNING', code: 'GTU 3170724', date: '01 DEC', start: `2026-12-01T${hm}:00+05:30`, end: '2026-12-01T13:00:00+05:30' },
    { name: 'EXAM 2: COMPILER DESIGN',  code: 'GTU 3170701', date: '03 DEC', start: `2026-12-03T${hm}:00+05:30`, end: '2026-12-03T13:00:00+05:30' },
    { name: 'EXAM 3: CLOUD COMPUTING',  code: 'GTU 3170717', date: '08 DEC', start: `2026-12-08T${hm}:00+05:30`, end: '2026-12-08T13:00:00+05:30' },
    { name: 'EXAM 4: ARTIFICIAL INTEL', code: 'GTU 3170716', date: '14 DEC', start: `2026-12-14T${hm}:00+05:30`, end: '2026-12-14T13:00:00+05:30' },
    { name: 'EXAM 5: MOBILE APP DEV',   code: 'GTU 3170726', date: '16 DEC', start: `2026-12-16T${hm}:00+05:30`, end: '2026-12-16T13:00:00+05:30' },
    { name: 'EXAM 6: DISTRIBUTED SYS',  code: 'GTU 3170719', date: '18 DEC', start: `2026-12-18T${hm}:00+05:30`, end: '2026-12-18T13:00:00+05:30' }
  ];
  const next = gtuPapers.find(p => now < new Date(p.end)) || gtuPapers[gtuPapers.length - 1];
  return {
    short: `⚔️ ${next.date}: GTU NEXT`,
    title: next.name,
    code: `${next.code} // ${next.date} • ${hm} AM IST`,
    dateStr: `${next.date} • ${hm} AM`,
    startIso: next.start,
    endIso: next.end,
    bgIdx: 2,
    variant: 'bloodmoon_fast'
  };
}

function buildFullCareerTimeline(now) {
  const hm = TIME_MODES[timeModeIdx].hm;
  return [
    getNextGtuExam(now, hm),
    {
      short: '🟢 18 DEC: MYDAYS',
      title: 'MYDAYS ARE COMING',

      startIso: '2026-12-18T13:00:00+05:30',
      endIso: '2026-12-18T13:00:00+05:30',
      bgIdx: 0, variant: 'bloodmoon_orig'
    },
    {
      short: '👑 06 FEB: GATE 2027',
      title: 'GATE 2027 CS',
      code: 'IIT MADRAS GATE CS // 06 FEB 2027 • 09:30 AM IST',
      dateStr: '06 FEB • 09:30 AM',
      startIso: '2027-02-06T09:30:00+05:30',
      endIso: '2027-02-06T12:30:00+05:30',
      bgIdx: 1, variant: 'bloodmoon_slow'
    },
    {
      short: '☢️ 14 MAR: BARC OCES',
      title: 'BARC OCES 2027 CBT',
      code: 'BARC SCIENTIFIC OFFICER C // 14 MAR 2027 • 09:00 AM IST',
      dateStr: '14 MAR • BARC CBT',
      startIso: '2027-03-14T09:00:00+05:30',
      endIso: '2027-03-14T11:00:00+05:30',
      bgIdx: 1, variant: 'bloodmoon_fast'
    },
    {
      short: '🛡️ 02 APR: DRDO & PSU',
      title: 'DRDO & PSU SELECTION',
      code: 'DRDO SCIENTIST B • BEL PE • ECIL GET • BARC UPLOAD',
      dateStr: '02 APR • DRDO/BARC',
      startIso: '2027-04-02T09:00:00+05:30',
      endIso: '2027-04-02T17:00:00+05:30',
      bgIdx: 3, variant: 'bloodmoon_orig'
    },
    {
      short: '🎙️ 12 MAY: BARC INTERVIEW',
      title: 'BARC & SEM 8 FINALE',
      code: 'BARC MUMBAI INTERVIEWS & GTU PDC // MAY-JUN 2027',
      dateStr: '12 MAY • MUMBAI',
      startIso: '2027-05-12T09:00:00+05:30',
      endIso: '2027-06-12T17:00:00+05:30',
      bgIdx: 0, variant: 'bloodmoon_study'
    },
    {
      short: '🏦 28 AUG: IBPS SO PRE',
      title: 'IBPS SO IT OFFICER',

/* =========================================================================
   5. LIVE NETWORK IST FETCHER & COUNTDOWN LOOP
   ========================================================================= */
async function syncLiveNetworkTime() {
  try {
    const t0 = Date.now();
    const res = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
    const dStr = res.headers.get('date');
    if (dStr) {
      const rtt = (Date.now() - t0) / 2;
      serverTimeOffsetMs = (new Date(dStr).getTime() + rtt) - Date.now();
    }
  } catch (e) {}
}

function getTrueNow() {
  return new Date(Date.now() + serverTimeOffsetMs);
}

function pad2(n) { return String(Math.max(0, n)).padStart(2, '0'); }

function computeCalendarDiff(targetDate, now) {
  if (now >= targetDate) return { m: '00', d: '00', h: '00', min: '00', s: '00', rawS: 0 };
  let months = (targetDate.getFullYear() - now.getFullYear()) * 12 + (targetDate.getMonth() - now.getMonth());
  let anchor = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(),
                        now.getHours(), now.getMinutes(), now.getSeconds());
  if (anchor > targetDate) {
    months--;
    anchor = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(),
                      now.getHours(), now.getMinutes(), now.getSeconds());
  }
  let rem = targetDate - anchor;
  const d = Math.floor(rem / 86400000); rem -= d * 86400000;
  const h = Math.floor(rem / 3600000); rem -= h * 3600000;
  const min = Math.floor(rem / 60000); rem -= min * 60000;
  const s = Math.floor(rem / 1000);
  return { m: pad2(months), d: pad2(d), h: pad2(h), min: pad2(min), s: pad2(s), rawS: s };
}

function updateDoomsdayClock() {
  const now = getTrueNow();
  MILESTONES[0] = getNextGtuExam(now, TIME_MODES[timeModeIdx].hm);

  const istString = new Intl.DateTimeFormat('en-IN', {
    timeZone: 'Asia/Kolkata',
    weekday: 'short', day: '2-digit', month: 'short',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
  }).format(now).toUpperCase();
  document.getElementById('networkTimeDisplay').textContent = `🛰️ IST: ${istString}`;

  MILESTONES.forEach((m, idx) => {
    const tStart = new Date(m.startIso);
    const tEnd = new Date(m.endIso);
    const miniEl = document.getElementById('miniT' + idx);

    let activeTarget = tStart;
    if (now >= tEnd) {
      if (miniEl) miniEl.textContent = '✅ DONE';
    } else {
      const d = computeCalendarDiff(tStart, now);
      if (miniEl) miniEl.textContent = `${d.m}:${d.d}:${d.h}:${d.min}:${d.s}`;
    }

    if (idx === activeIdx) {
      const diff = computeCalendarDiff(activeTarget, now);
      document.getElementById('pathKicker').textContent = m.code;
      document.getElementById('headingText').textContent = m.title;
      document.getElementById('dMonth').textContent = diff.m;
      document.getElementById('dDays').textContent = diff.d;
      document.getElementById('dHours').textContent = diff.h;
      document.getElementById('dMinutes').textContent = diff.min;
      const secEl = document.getElementById('dSeconds');
      secEl.textContent = diff.s;

      if (diff.rawS !== lastSec) {
        lastSec = diff.rawS;
        secEl.classList.add('tick-pulse');
        setTimeout(() => secEl.classList.remove('tick-pulse'), 110);
        playTieTikSound(true);
        const v = JELLO_VARIANTS[audioMode] || JELLO_VARIANTS.bloodmoon_orig;
        if (v.doubleTick) {
          setTimeout(() => playTieTikSound(false), 500);
        }
      }
    }
  });
}

/* =========================================================================

   ========================================================================= */
const ashCanvas = document.getElementById('ashCanvas');
const ashCtx = ashCanvas.getContext('2d');
let motes = [];
function initMotes() {
  ashCanvas.width = window.innerWidth;
  ashCanvas.height = window.innerHeight;
  motes = Array.from({ length: 42 }, () => ({
    x: Math.random() * ashCanvas.width,
    y: Math.random() * ashCanvas.height,
    r: Math.random() * 1.6 + 0.4,
    vx: (Math.random() - 0.5) * 0.22,
    vy: -Math.random() * 0.35 - 0.08,
    alpha: Math.random() * 0.55 + 0.15
  }));
}
function animateMotes() {
  ashCtx.clearRect(0, 0, ashCanvas.width, ashCanvas.height);
  for (const m of motes) {
    m.x += m.vx; m.y += m.vy;
    if (m.y < 0) m.y = ashCanvas.height;
    if (m.x < 0) m.x = ashCanvas.width;
    if (m.x > ashCanvas.width) m.x = 0;
    ashCtx.beginPath();
    ashCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
    ashCtx.fillStyle = `rgba(215, 255, 175, ${m.alpha})`;
    ashCtx.fill();
  }
  requestAnimationFrame(animateMotes);
}
window.addEventListener('resize', initMotes);

function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
